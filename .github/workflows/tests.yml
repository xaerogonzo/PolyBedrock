name: tests

# push and pull_request run the SAME job with the SAME conditions, on purpose.
# A lenient job on push and a strict one on PRs is how a repo ends up with a
# green push run sitting on top of a red pull_request run.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: PolyBedrock's own suites ──────────────────────────────────────
  polybedrock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          pip install -e core -e ui pytest
      - name: core
        run: python -m pytest core/tests
      - name: ui
        run: python -m pytest ui/tests

  # ── Stage 2: the consumers ──────────────────────────────────────────────────
  #
  # PolyBedrock is infrastructure: its own suite passing is not evidence that a
  # change is safe. Both consumers run here, and both are pinned to a **commit**
  # rather than to `master`.
  #
  # The pin is the point. Testing PolyBedrock@HEAD against consumer@master means
  # two moving branches proving each other, which can go green for a pair of
  # mutually-dependent changes that would not work against any released version
  # of either -- and it makes a red run ambiguous between "the substrate broke
  # the consumer" and "the consumer was already broken". A commit answers both.
  #
  # PolyBedrock carries no tags yet, so these are SHAs; they become tags when
  # there are tags. **Bump them deliberately**, as the act of declaring support
  # for a newer consumer revision -- not automatically, which would restore the
  # moving target this exists to remove.
  #
  # PolyShield's suite must pass UNEDITED. A test that needs changing means an
  # extraction was not behaviour-preserving (see docs/adr/0002).
  consumers:
    needs: polybedrock
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PolyShield
            repo: xaerogonzo/Polyshield-Antivirus
            ref: f2ba72d8fe90fa3a3146c7390a8f2832fcfcb586   # master, 2026-10-15
            # Declares polybedrock-{core,ui} as git URLs -- now pinned to a
            # commit on PolyShield's side too, so this step clones that
            # revision before the local substrate overwrites it below. The
            # overwrite is the point, and the assert step proves it won.
            #
            # PolyShield's own tests/test_substrate_pin.py asserts the
            # substrate it imports is inside >=0.1,<0.2. That assertion runs
            # against whatever this job installs -- so a PolyBedrock version
            # bump past 0.2 turns this consumer red on purpose rather than
            # being discovered downstream.
            #
            # Covers PolyShield 8cf7dda..f2ba72d: 30 commits behind master when
            # this PR was opened (`.github/scripts/pin_distance.py`). Unlike
            # the earlier bumps this range adds NO substrate API use: the only
            # polybedrock-related lines it changes are PolyShield's own pin of
            # this repository (2801424 -> 1ce539b, at all four sites), which
            # is exactly this repository's current master. So what the bump
            # validates is PolyShield's growth against the substrate -- the
            # build-smoke workflow and its installer-refusal test, the
            # settings BOM fix arriving in a built product, the PATH_STATUS
            # query, the intelligence-lock test isolation -- not new coupling.
            #
            # PolyShield's own CI and an on-demand build-smoke run on f2ba72d
            # are green; this job adds the thing neither can: the suite
            # against a PolyBedrock that is not the pinned one.
            #
            # Expected to stay green with PolyShield's suite UNEDITED, with
            # POLYBEDROCK_SUBSTRATE_OVERLAY declaring the overlay deliberate
            # (see the test step).
            install: pip install -r requirements-ci.txt
          - name: PolyScour
            repo: xaerogonzo/PolyScour
            ref: 302bb6d0bfbe58a82c13a396a8128f5a708ed438   # master, 2026-09-30
            # Covers PolyScour c436a81..302bb6d: 36 commits behind master when
            # this PR was opened (`.github/scripts/pin_distance.py`, the number
            # docs/ECOSYSTEM_HEALTH.md says to look at). That is a long way for
            # a pin to have drifted, and the size of it is the reason this PR
            # exists rather than a reason to trust it: it is the amount of
            # PolyScour this repository had not validated.
            #
            # Unlike the last bump, this range DOES move the import surface.
            # Newly consumed from polybedrock, all of it already at master:
            #   * polybedrock.schtasks_run.run_schtasks -- scheduled cleaning
            #     (scheduling/task.py; its own tests run against real
            #     throwaway scheduled tasks), the helper added in 2801424
            #   * polybedrock.startup.RunEntry and extract_path -- the
            #     view-only "everything else that starts with Windows" list,
            #     and the 32-bit machine-wide Run key's own approval record
            #     (the HKLM_WOW6432 hive_name)
            #   * polybedrock.ps_run.run_ps from scheduling/task.py, for
            #     Get-ScheduledTask verification
            # The rest of the range -- Recycle Bin cleaning, pip/npm/Cargo
            # cache rules, the installed-program uninstaller, the elevated
            # request being cancellable, release 0.3.0 -- is PolyScour's own.
            #
            # Known and NOT a regression: PolyScour's tests/test_uishot.py
            # golden comparison drifts on the maintainer's machine with or
            # without these changes (font rasterisation and DPI). If this job
            # reports it, compare against a run at the previous pin before
            # attributing it to the substrate.
            install: pip install -e ../polybedrock/core -e ../polybedrock/ui -e .[dev]
    steps:
      - uses: actions/checkout@v7
        with:
          path: polybedrock
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: consumer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ${{ matrix.name }} deps
        working-directory: consumer
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Install PolyBedrock under test
        # Last, and unconditionally, for both consumers. A consumer may declare
        # polybedrock from a git URL or an index; whatever it pulled, this is
        # what overwrites it. Without this step the job could report a green
        # consumer against a PolyBedrock that is not the one being changed --
        # which is the one result this stage must never produce.
        run: pip install -e polybedrock/core -e polybedrock/ui
      - name: Prove the substrate under test is the one imported
        # Not a print -- a gate. `polybedrock` is a PEP 420 namespace package,
        # so a consumer's own git-URL dependency can leave a second copy in
        # site-packages that keeps serving submodules after the editable
        # install lands. Observed: PolyShield's job listed a hostedtoolcache
        # portion *ahead* of the checkout in polybedrock.__path__. Reading a
        # winner off that list is guesswork, so this imports a module from each
        # distribution and asks where it actually came from.
        run: python polybedrock/.github/scripts/assert_substrate.py polybedrock
      - name: Run ${{ matrix.name }} tests
        working-directory: consumer
        env:
          PYTHONIOENCODING: utf-8
          # This job installs polybedrock editable over the consumer's pin on
          # purpose (the step above). PolyShield's pin test fails any editable
          # substrate under CI unless told the overlay is deliberate; declared
          # here, not inferred, so PolyShield's own CI still fails on one.
          # Harmless to PolyScour, which does not read it.
          POLYBEDROCK_SUBSTRATE_OVERLAY: "1"
        run: python -m pytest
