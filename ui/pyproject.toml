[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybedrock-ui"
version = "0.1.0"
description = "CustomTkinter theming and shared widget behaviour for the Forge suite."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "customtkinter>=5.2.2",
    # uishot captures windows into PIL images and diffs them against goldens.
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# See the note in core/pyproject.toml — no src/polybedrock/__init__.py here either.
[tool.setuptools.packages.find]
where = ["src"]
include = ["polybedrock*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
